version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - tesvik_network

  orchestration_service:
    build:
      context: .
      dockerfile: services/orchestration_service/Dockerfile
    container_name: orchestration_service
    ports:
      - "8000:8000"
    volumes:
      - ./services/orchestration_service:/app/services/orchestration_service
      - ./shared:/app/shared
    working_dir: /app/services/orchestration_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - MATCHING_SERVICE_URL=http://matching_service:8001
      - RAG_SERVICE_URL=http://rag_service:8002
    depends_on:
      - matching_service
      - rag_service
    networks:
      - tesvik_network

  matching_service:
    build:
      context: .
      dockerfile: services/matching_service/Dockerfile
    container_name: matching_service
    ports:
      - "8001:8001"
    volumes:
      - ./services/matching_service:/app/services/matching_service
      - ./shared:/app/shared
    working_dir: /app/services/matching_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - tesvik_network

  rag_service:
    build:
      context: .
      dockerfile: services/rag_service/Dockerfile
    container_name: rag_service
    ports:
      - "8002:8002"
    volumes:
      - ./services/rag_service:/app/services/rag_service
      - ./shared:/app/shared
    working_dir: /app/services/rag_service
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - tesvik_network

  ingestion_service:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile
    container_name: ingestion_service
    profiles:
      - setup
    volumes:
      - ./services/ingestion_service:/app/services/ingestion_service
      - ./shared:/app/shared
    working_dir: /app/services/ingestion_service
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - tesvik_network

volumes:
  qdrant_storage:

networks:
  tesvik_network:
    driver: bridge